# Local infrastructure for RollRadar. Start with: docker compose up -d
# Credentials come from .env (copy .env.example to .env and set a password).
services:
  db:
    image: postgres:17-alpine
    container_name: rollradar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rollradar}
      POSTGRES_USER: ${POSTGRES_USER:-rollradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only, so the database is not exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rollradar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rollradar-db-data:
